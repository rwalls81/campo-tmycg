<style>
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface2:#E4ECE8; --ink:#12211F; --muted:#5B6B66;
  --acc:#0E6E63; --acc-ink:#FFFFFF; --acc-soft:#DCEBE7;
  --sig:#B87503; --sig-ink:#FFFFFF; --sig-soft:#F6E9CF;
  --ok:#2E7D4F; --ok-soft:#DFEEDF; --bad:#A63B2A; --bad-soft:#F4E0DA;
  --warn:#8A6A1F; --warn-soft:#F1E8CE;
  --line:#D3DDD8; --code-bg:#12211F; --code-ink:#E6EEEA;
  --heat:220,60,40;
  --shadow:0 1px 3px rgba(18,33,31,.08),0 6px 18px rgba(18,33,31,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1917; --surface:#182420; --surface2:#213029; --ink:#E7EDEA; --muted:#9BADA6;
    --acc:#5FB8A8; --acc-ink:#0B1A17; --acc-soft:#1E3B36;
    --sig:#E0A63F; --sig-ink:#241A06; --sig-soft:#3B2E14;
    --ok:#6FBF8B; --ok-soft:#22352A; --bad:#E08874; --bad-soft:#3A241E;
    --warn:#D9B85C; --warn-soft:#37301C;
    --line:#2F3F39; --code-bg:#0A1210; --code-ink:#D8E2DC;
    --heat:255,110,80;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1917; --surface:#182420; --surface2:#213029; --ink:#E7EDEA; --muted:#9BADA6;
  --acc:#5FB8A8; --acc-ink:#0B1A17; --acc-soft:#1E3B36;
  --sig:#E0A63F; --sig-ink:#241A06; --sig-soft:#3B2E14;
  --ok:#6FBF8B; --ok-soft:#22352A; --bad:#E08874; --bad-soft:#3A241E;
  --warn:#D9B85C; --warn-soft:#37301C;
  --line:#2F3F39; --code-bg:#0A1210; --code-ink:#D8E2DC;
  --heat:255,110,80;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=date]{min-height:44px}
textarea{resize:vertical;min-height:70px}
label{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .s{font-size:.76rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.btn{padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn-sig{background:var(--sig);color:var(--sig-ink)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:1.7rem;margin-bottom:8px}
.hero p{margin:0;color:var(--muted)}
.kicker{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.sect{margin:26px 0 12px}
.sect h2{font-size:1.15rem}
.sect .sub{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow);width:100%}
button.card:not([disabled]):hover{border-color:var(--acc)}
.card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip-u{background:var(--acc-soft);color:var(--acc)}
.chip-modo{background:var(--sig-soft);color:var(--sig)}
.chip-st{background:var(--surface2);color:var(--muted)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.card h3{font-size:1.02rem}
.card .desc{font-size:.88rem;color:var(--muted);margin:0}
.card .meta{font-size:.78rem;color:var(--muted)}
.card.locked{opacity:.6}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:1.05rem;margin-bottom:6px}
.panel p{margin:0 0 8px}
.paso{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sig);margin-bottom:6px}
.note{font-size:.84rem;color:var(--muted)}
.back{background:transparent;color:var(--acc);font-weight:600;padding:8px 0;margin-bottom:8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}
.stat .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.stat>div{background:var(--surface2);border-radius:12px;padding:12px}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:1.35rem;letter-spacing:.12em;text-align:center;font-weight:700;user-select:all}
.codewrap{background:var(--surface);border:1.5px solid var(--acc);border-radius:14px;padding:16px;margin:14px 0}
.codewrap .k{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.codewrap .who{font-size:.86rem;color:var(--muted);margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .t{font-weight:600}
.item .m{font-size:.8rem;color:var(--muted)}
.item .x{background:transparent;color:var(--bad);font-weight:700;padding:2px 6px;flex:none}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.74rem;font-weight:600}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-warn{background:var(--warn-soft);color:var(--warn)} .pill-bad{background:var(--bad-soft);color:var(--bad)} .pill-acc{background:var(--acc-soft);color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);border:1.5px solid var(--line);padding:9px 12px;border-radius:10px;font-weight:600;font-size:.9rem;min-width:44px}
.seg button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.seg.big button{min-width:52px;padding:12px 0;font-size:1.05rem}
.sl{display:flex;align-items:center;gap:10px}
.sl input[type=range]{padding:0;height:36px}
.sl .v{font-family:"JetBrains Mono",monospace;font-weight:700;min-width:1.4em;text-align:center}
.table{width:100%;border-collapse:collapse;font-size:.86rem}
.table th,.table td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.table th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.table td.num{font-variant-numeric:tabular-nums;text-align:right}
.tablewrap{overflow-x:auto}
.msg{font-size:.9rem;margin-top:10px;color:var(--muted)}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.92rem}
.fb-ok{background:var(--ok-soft);color:var(--ok)} .fb-bad{background:var(--bad-soft);color:var(--bad)} .fb-warn{background:var(--warn-soft);color:var(--warn)} .fb-acc{background:var(--acc-soft);color:var(--acc)}
.radar{position:relative;width:100%;aspect-ratio:1/1;max-width:420px;margin:8px auto;background:var(--surface2);border-radius:12px;overflow:hidden}
.radar .q{position:absolute;width:50%;height:50%;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px}
.radar .q.hot{color:var(--acc)}
.radar .ax{position:absolute;background:var(--line)}
.radar .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--surface);transform:translate(-50%,50%);box-shadow:var(--shadow)}
.radar .dot.moda{background:var(--sig)}
.radar .lbl{position:absolute;font-size:.7rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
.overlay img{max-width:100%;max-height:100%;object-fit:contain}
.overlay .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--acc);width:100%;transform-origin:left}
.overlay .ready{color:#fff;text-align:center;padding:24px}
.overlay .ready h2{color:#fff;font-size:1.6rem;margin-bottom:10px}
.stim{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:10px;overflow:hidden;background:var(--surface2);touch-action:manipulation}
.stim img{display:block;width:100%;height:auto}
.stim .gl{position:absolute;inset:0;pointer-events:none}
.stim .gl div{position:absolute;border:1px dashed rgba(255,255,255,.75);mix-blend-mode:difference}
.stim .zn{position:absolute;font-family:"JetBrains Mono",monospace;font-size:.7rem;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:6px;pointer-events:none}
.stim .tap{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--sig);color:var(--sig-ink);font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.stim canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.timer{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:2.4rem;text-align:center;font-variant-numeric:tabular-nums;padding:8px}
.semaforo{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.docente{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.docente h3{font-size:1.05rem;margin-bottom:8px}
.toggles{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.toggles label{display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:.92rem;font-weight:500;color:var(--ink)}
.toggles input{width:auto;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;margin-bottom:8px}
.chk input{width:auto;margin-top:4px}
.val-out{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.92rem}
.qrwrap{display:flex;justify-content:center;margin-top:12px}
.qrwrap svg{background:#fff;border-radius:12px;padding:12px;width:230px;height:230px}
.footer{margin-top:40px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.sum{font-family:"JetBrains Mono",monospace;font-size:.76rem;white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px;max-height:220px;overflow:auto}
@media (prefers-reduced-motion:reduce){.overlay .bar{transition:none}}
</style>

    let v=0n;
    for(const ch of cl){ const k=AB.indexOf(ch); if(k<0) return null; v=(v<<5n)|BigInt(k); }
    const mac=Number(v&0x7FFFFFn); v>>=23n;
    const grpIdx=Number(v&3n); v>>=2n;
    const dias=Number(v&4095n); v>>=12n;
    const score=Number(v&127n); v>>=7n;
    const scnIdx=Number(v&15n); v>>=4n;
    const ver=Number(v&3n);
    if(ver!==1 || scnIdx>=CODE_IDS.length) return null;
    if(mac!==macDe(scnIdx,score,dias,grpIdx,nombre)) return null;
    const f=new Date(Date.UTC(2026,0,1)+dias*86400000).toISOString().slice(0,10);
    return {mod:CODE_IDS[scnIdx], grupo:GRUPOS[grpIdx]||"Otro", n:score, fecha:f};
  }catch(e){ return null; }
}

/* ================= 2. TEST DE 5 SEGUNDOS ================= */
function zonaDe(x,y){ return Math.min(2,Math.floor(x*3)) + 3*Math.min(2,Math.floor(y*3)) + 1; }
function t5sAciertos(p, cfg){
  const a = [];
  a.push(normTxt(p.marca).length>1 && (normTxt(cfg.marca).includes(normTxt(p.marca)) || normTxt(p.marca).includes(normTxt(cfg.marca))));
  a.push(normTxt(p.color).length>1 && (normTxt(cfg.color).includes(normTxt(p.color)) || normTxt(p.color).includes(normTxt(cfg.color))));
  const pn = (String(p.precio).match(/\d+(\.\d+)?/)||[])[0], cn=(String(cfg.precio).match(/\d+(\.\d+)?/)||[])[0];
  a.push(pn!=null && cn!=null && Math.abs(parseFloat(pn)-parseFloat(cn))<=Math.max(1,parseFloat(cn)*0.1));
  a.push(String(p.personas)===String(cfg.personas));
  return a;
}
function t5s(){
  const m = modOf("T5S"); const d = jGet("tc_t5s",{cfg:{marca:"",color:"",precio:"",personas:"Sí",zMarca:"",zPrecio:"",zImagen:"",anuncio:""},img:null,part:[]}); d.part=d.part||[]; d.cfg=d.cfg||{};
  const n = d.part.length;
  const zonas = Array.from({length:9},(_,i)=>({z:i+1,c1:0,c2:0,c3:0}));
  d.part.forEach(p=>(p.taps||[]).forEach((t,k)=>{ const z=zonas[t.z-1]; if(z) z["c"+(k+1)]++; }));
  const ac = d.part.map(p=>p.ac||[false,false,false,false]);

function mostrarEstimulo(d, edad){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="ready"><h2>Entrega el teléfono al participante</h2><p>Cuando toque «Listo», verá la imagen cinco segundos. No le digas qué mirar.</p><button class="btn btn-acc" id="rdy" style="margin-top:14px;font-size:1.1rem">Listo</button></div>`;
  document.body.appendChild(ov);
  document.getElementById("rdy").addEventListener("click",()=>{
    ov.innerHTML=`<img src="${d.img}" alt=""><div class="bar" id="bar"></div>`;
    const bar=document.getElementById("bar"); const t0=performance.now();
    const tick=()=>{ const e=performance.now()-t0; bar.style.transform=`scaleX(${Math.max(0,1-e/5000)})`; if(e<5000) requestAnimationFrame(tick); else { ov.remove(); preguntasT5S(d, edad); } };
    requestAnimationFrame(tick);
  });
}
function preguntasT5S(d, edad){
  const box=document.getElementById("preg");
  box.innerHTML=`<div class="fb fb-acc" style="margin-top:14px"><b>Ahora las cuatro preguntas.</b> Escribe lo que el participante responde, tal cual. No corrijas, no ayudes, no reacciones.</div>
    <div class="grid2" style="margin-top:12px"><div class="field"><label for="pma">¿Qué marca era?</label><input id="pma" autocomplete="off"></div><div class="field"><label for="pco">¿Qué color dominaba?</label><input id="pco" autocomplete="off"></div>
    <div class="field"><label for="ppr">¿Cuánto costaba?</label><input id="ppr" autocomplete="off" inputmode="decimal"></div><div class="field"><label>¿Había personas?</label><div class="seg" id="ppe"><button data-v="Sí">Sí</button><button data-v="No">No</button><button data-v="No sabe">No sabe</button></div></div></div>
    <div class="paso" style="margin-top:8px">Las tres calcomanías</div><p class="note">Entrega el teléfono: «toca donde fue tu mirada primero, después y al final». Tres toques.</p>
    <div class="stim" id="tapbox"><img src="${d.img}" alt="Anuncio"><div class="gl">${[1,2].map(i=>`<div style="left:${i*33.333}%;top:0;height:100%;width:0"></div><div style="top:${i*33.333}%;left:0;width:100%;height:0"></div>`).join("")}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" id="untap">Deshacer toque</button><span class="note" id="tapn">0 de 3</span></div>
    <button class="btn btn-acc btn-block" id="savep" style="margin-top:12px">Guardar participante</button><div class="msg" id="pmsg"></div>`;
  let personas=""; const taps=[];
  document.querySelectorAll("#ppe button").forEach(b=>b.addEventListener("click",()=>{ personas=b.dataset.v; document.querySelectorAll("#ppe button").forEach(x=>x.classList.toggle("on",x===b)); }));
  const tb=document.getElementById("tapbox");
  tb.addEventListener("click",e=>{ if(taps.length>=3) return; const r=tb.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; if(x<0||x>1||y<0||y>1) return;
    taps.push({x:+x.toFixed(3),y:+y.toFixed(3),z:zonaDe(x,y)}); const m=document.createElement("div"); m.className="tap"; m.textContent=taps.length; m.style.left=(x*100)+"%"; m.style.top=(y*100)+"%"; tb.appendChild(m); document.getElementById("tapn").textContent=taps.length+" de 3"; });
  document.getElementById("untap").addEventListener("click",()=>{ if(!taps.length) return; taps.pop(); const ms=tb.querySelectorAll(".tap"); ms[ms.length-1].remove(); document.getElementById("tapn").textContent=taps.length+" de 3"; });
  document.getElementById("savep").addEventListener("click",()=>{
    const p={edad, marca:document.getElementById("pma").value.trim(), color:document.getElementById("pco").value.trim(), precio:document.getElementById("ppr").value.trim(), personas, taps:taps.slice()};
    if(!personas){ document.getElementById("pmsg").textContent="Falta la respuesta de «¿había personas?»."; return; }
    if(taps.length<3){ document.getElementById("pmsg").textContent="Faltan calcomanías: son tres toques."; return; }
    p.ac=t5sAciertos(p,d.cfg); d.part.push(p); jSet("tc_t5s",d); t5s();
  });
  box.scrollIntoView({behavior:"smooth"});
}

const SENTIDOS = ["Vista: luz, color, orden, señalética","Oído: música, tempo, volumen, ruido","Olfato: aromas naturales o artificiales","Tacto: materiales, temperatura, ¿se puede tocar?","Gusto: degustación o muestra"];
function tienda(){
  const m=modOf("TIENDA"); const d=jGet("tc_tienda",{t:{nombre:"",tipo:"Autoservicio",cuando:"",afluencia:""},sent:["","","","",""],comp:[]}); d.comp=d.comp||[]; d.sent=d.sent||["","","","",""]; d.t=d.t||{};

    .concat(n?["", `Promedio ${fmt(mean(segs),0)} s frente al anaquel · tocó ${pc("toco")}% · leyó ${pc("leyo")}% · compró ${pc("compro")}%`]:[]).join("\n");

      <div class="paso">Paso 2 · Auditoría de los cinco sentidos</div><p class="note">Qué estímulo encontraste, qué intención comercial aparente tiene y qué efecto produjo en ti. Si un sentido no está trabajado, anótalo: la ausencia también es un dato.</p>
      ${SENTIDOS.map((s,i)=>`<div class="field"><label for="se${i}">${esc(s)}</label><textarea id="se${i}" rows="2">${esc(d.sent[i])}</textarea></div>`).join("")}

    <div class="panel"><div class="paso">Paso 3 · Observación de compradores</div><h3>Comprador ${n+1}</h3>

}

const SEGURIDAD = ["Producto comercial sellado, dentro de su fecha de caducidad","Sin alcohol","Lista de ingredientes mostrada y alergias preguntadas antes de probar","Solo mayores de edad","Consentimiento verbal de cada participante"];
function placebo(){
  const m=modOf("PLACEBO"); const d=jGet("tc_placebo",{seg:[false,false,false,false,false],cfg:{producto:"",pa:"",pb:"",hip:""},part:[],anc:{alta:"",baja:"",part:[]}}); d.part=d.part||[]; d.cfg=d.cfg||{}; d.seg=d.seg||[false,false,false,false,false]; d.anc=d.anc||{alta:"",baja:"",part:[]}; d.anc.part=d.anc.part||[];

  const txt=[`PRUEBA DE PLACEBO DE PRECIO · Práctica 5 · ${perfil()?perfil().nombre:""}`, `Producto: ${d.cfg.producto||"—"} · Precio A (bajo): ${d.cfg.pa||"—"} · Precio B (alto): ${d.cfg.pb||"—"}`, `Hipótesis (antes de empezar): ${d.cfg.hip||"—"}`, `Seguridad: ${segOk?"lista completa verificada":"INCOMPLETA"}`, "", `Participantes: ${n}`]

    .concat(d.anc.part.length?["", `Anclaje (Paso 4): ancla alta ${d.anc.alta} → disposición a pagar promedio ${fmt(mean(AH),0)} (n=${AH.length}, rango ${AH.length?Math.min(...AH)+"–"+Math.max(...AH):"—"}); ancla baja ${d.anc.baja} → ${fmt(mean(AL),0)} (n=${AL.length}, rango ${AL.length?Math.min(...AL)+"–"+Math.max(...AL):"—"})`]:[]).join("\n");
  $app.innerHTML=cabecera(m)+`
    <div class="panel"><div class="paso">Seguridad, antes de nada</div><h3>Sin esto no se prueba nada</h3>
      ${SEGURIDAD.map((s,i)=>`<div class="chk"><input type="checkbox" id="sg${i}" ${d.seg[i]?"checked":""}><span>${esc(s)}</span></div>`).join("")}</div>
    <div class="panel"><div class="paso">Paso 1 · Diseño del experimento</div><h3>Un producto, dos etiquetas</h3>
      <div class="field"><label for="ppro">Producto usado</label><input id="ppro" value="${esc(d.cfg.producto)}" placeholder="Mismo lote, mismo envase, misma temperatura"></div>
      <div class="grid2"><div class="field"><label for="ppa">Precio A (bajo)</label><input id="ppa" inputmode="decimal" value="${esc(d.cfg.pa)}" placeholder="$"></div><div class="field"><label for="ppb">Precio B (alto)</label><input id="ppb" inputmode="decimal" value="${esc(d.cfg.pb)}" placeholder="$"></div></div>
      <div class="field"><label for="phip">Hipótesis, escrita antes de empezar</label><textarea id="phip" ${n?"readonly":""}>${esc(d.cfg.hip)}</textarea>${n?`<p class="note">Con participantes registrados la hipótesis ya no se edita: si se escribe después, no es hipótesis.</p>`:""}</div>
      <button class="btn btn-ghost btn-block" id="psave">Guardar diseño</button></div>
    <div class="panel"><div class="paso">Paso 2 · Protocolo</div><h3>Participante ${n+1} · le toca la etiqueta <span class="pill pill-acc" style="font-size:1rem">${sig}</span></h3>
      <p class="note">Asignación alternada automática: A, B, A, B… Cada persona prueba una sola versión, ve su etiqueta de precio y califica del 1 al 7. No menciones que hay dos precios. No reacciones a las respuestas.</p>
      <div class="field"><label>Calidad percibida (1 = muy mala · 7 = excelente)</label><div class="seg big" id="cal">${[1,2,3,4,5,6,7].map(v=>`<button data-v="${v}">${v}</button>`).join("")}</div></div>
      <div class="field"><label>¿Lo compraría a ese precio?</label><div class="seg" id="cmp"><button data-v="1">Sí</button><button data-v="0">No</button></div></div>
      <div class="field"><label for="pcom">Comentario textual</label><input id="pcom" placeholder="Lo que dijo, tal cual"></div>
      <button class="btn btn-acc btn-block" id="padd" ${segOk&&cfgOk?"":"disabled"}>${segOk?(cfgOk?"Guardar participante":"Primero guarda el diseño del experimento"):"Completa la lista de seguridad"}</button><div class="msg" id="pmsg"></div></div>
    <div class="panel"><div class="paso">Paso 3 · Resultados</div><h3>${n} participante${n===1?"":"s"}</h3>
      ${n?`<div class="tablewrap"><table class="table"><tr><th></th><th>Grupo A (${esc(d.cfg.pa)})</th><th>Grupo B (${esc(d.cfg.pb)})</th><th>Diferencia</th></tr>
        <tr><td>Participantes</td><td class="num">${A.length}</td><td class="num">${B.length}</td><td class="num">—</td></tr>
        <tr><td>Calidad percibida promedio</td><td class="num">${fmt(mA,2)}</td><td class="num">${fmt(mB,2)}</td><td class="num"><b>${mA!=null&&mB!=null?fmt(mB-mA,2):"—"}</b></td></tr>
        <tr><td>% que lo compraría</td><td class="num">${cA==null?"—":cA+"%"}</td><td class="num">${cB==null?"—":cB+"%"}</td><td class="num">${cA!=null&&cB!=null?(cB-cA)+" pts":"—"}</td></tr></table></div>
      <div class="fb ${mA!=null&&mB!=null?(mB>mA?"fb-ok":mB<mA?"fb-warn":"fb-acc"):"fb-acc"}" style="margin-top:12px">${mA!=null&&mB!=null?(mB>mA?`El precio alto obtuvo mejor calificación (+${fmt(mB-mA,2)}): la dirección que predice el efecto placebo del precio.`:mB<mA?`El precio alto obtuvo peor calificación (${fmt(mB-mA,2)}): contradice la hipótesis del placebo. Repórtalo tal cual salió.`:"Sin diferencia entre grupos."):"Faltan participantes en uno de los grupos."} Con ${n} personas la diferencia puede ser pequeña; importa la dirección y reportarla tal cual.</div>
      <div class="list" style="margin-top:12px">${d.part.map((p,i)=>`<div class="item"><div><div class="t">${i+1}. Grupo ${p.g} · ${p.cal}/7 · ${p.compra?"compraría":"no compraría"}</div><div class="m">${esc(p.com||"—")}</div></div><button class="x" data-i="${i}" title="Eliminar">✕</button></div>`).join("")}</div>`:`<p class="note">Los resultados aparecen con el primer participante. Mínimo cuatro tuyos; veinte por equipo.</p>`}</div>

      <div class="grid2"><div class="field"><label for="aal">Ancla alta mostrada</label><input id="aal" inputmode="decimal" value="${esc(d.anc.alta)}" placeholder="$"></div><div class="field"><label for="aba">Ancla baja mostrada</label><input id="aba" inputmode="decimal" value="${esc(d.anc.baja)}" placeholder="$"></div></div>
      <div class="grid2"><div class="field"><label>Ancla que vio · le toca <b>${d.anc.part.length%2===0?"alta":"baja"}</b></label><div class="seg" id="anc"><button data-v="alta" class="${d.anc.part.length%2===0?"on":""}">Alta</button><button data-v="baja" class="${d.anc.part.length%2===1?"on":""}">Baja</button></div></div><div class="field"><label for="adap">Disposición a pagar ($)</label><input id="adap" inputmode="decimal"></div></div>
      <button class="btn btn-ghost btn-block" id="aadd">Guardar respuesta de anclaje</button><div class="msg" id="amsg"></div>
      ${d.anc.part.length?`<div class="stat"><div><div class="n">${fmt(mean(AH),0)}</div><div class="l">Pagarían con ancla alta (n=${AH.length})</div></div><div><div class="n">${fmt(mean(AL),0)}</div><div class="l">Con ancla baja (n=${AL.length})</div></div></div>`:""}</div>
    ${codigoCard("PLACEBO", n)}

  bindTop(); document.getElementById("back").addEventListener("click",home);
  SEGURIDAD.forEach((s,i)=>document.getElementById("sg"+i).addEventListener("change",e=>{ d.seg[i]=e.target.checked; jSet("tc_placebo",d); placebo(); }));
  document.getElementById("psave").addEventListener("click",()=>{ d.cfg={producto:document.getElementById("ppro").value.trim(),pa:document.getElementById("ppa").value.trim(),pb:document.getElementById("ppb").value.trim(),hip:document.getElementById("phip").value.trim()}; jSet("tc_placebo",d); placebo(); });
  let cal=null, compra=null;
  document.querySelectorAll("#cal button").forEach(b=>b.addEventListener("click",()=>{ cal=+b.dataset.v; document.querySelectorAll("#cal button").forEach(x=>x.classList.toggle("on",x===b)); }));
  document.querySelectorAll("#cmp button").forEach(b=>b.addEventListener("click",()=>{ compra=b.dataset.v==="1"; document.querySelectorAll("#cmp button").forEach(x=>x.classList.toggle("on",x===b)); }));
  document.getElementById("padd").addEventListener("click",()=>{ const msg=document.getElementById("pmsg"); if(cal==null||compra==null){ msg.textContent="Falta la calificación del 1 al 7 o la respuesta de compra."; return; } d.part.push({g:sig,cal,compra,com:document.getElementById("pcom").value.trim()}); jSet("tc_placebo",d); placebo(); });
  let ancla=d.anc.part.length%2===0?"alta":"baja";

  document.querySelectorAll(".item .x").forEach(b=>b.addEventListener("click",()=>{ if(confirm("¿Eliminar este participante?")){ d.part.splice(+b.dataset.i,1); jSet("tc_placebo",d); placebo(); } }));
  bindResumen(txt,"tc_placebo",placebo,"PLACEBO",n);
  window.scrollTo(0,0);
}

/* ================= 5. TABLERO DE INDICADORES ================= */
function kpiCompleto(k){ return k.objetivo&&k.nombre&&k.formula&&k.frecuencia&&[k.base,k.meta,k.rojo,k.verde].every(v=>v!==""&&v!=null&&!isNaN(v)); }
function semaforo(k){ const v=parseFloat(k.actual); if(isNaN(v)) return null; if(v>=parseFloat(k.verde)) return "Verde"; if(v<parseFloat(k.rojo)) return "Rojo"; return "Amarillo"; }
function kpi(){
  const m=modOf("KPI"); const d=jGet("tc_kpi",{ind:[]}); d.ind=d.ind||[];
  const n=d.ind.filter(kpiCompleto).length;
  const txt=[`TABLERO DE INDICADORES · Práctica 6 · ${perfil()?perfil().nombre:""}`,""].concat(d.ind.map((k,i)=>`${i+1}. ${k.objetivo} → ${k.nombre} (${k.tipo})\n   Fórmula: ${k.formula} · Fuente: ${k.fuente||"—"} · ${k.frecuencia} · Responsable: ${k.resp||"—"}\n   Línea base ${k.base} · Meta ${k.meta} · Rojo < ${k.rojo} · Verde ≥ ${k.verde} · Actual ${k.actual===""?"—":k.actual} → ${semaforo(k)||"sin dato"}`)).join("\n");
  const col={Verde:"var(--ok)",Amarillo:"var(--warn)",Rojo:"var(--bad)"};
  $app.innerHTML=cabecera(m)+`
    <div class="panel"><div class="paso">Pasos 2 y 3 · Un indicador por objetivo, con umbrales</div><h3>Nuevo indicador</h3>
      <p class="note">Los umbrales se fijan antes de ver los datos; si se ajustan después para que todo salga verde, la evaluación dejó de servir. Ocho indicadores o menos.</p>
      <div class="grid2"><div class="field"><label for="ko">Objetivo al que sirve</label><select id="ko">${["Comercial","De mercado","De marca","De cliente","Ejecución"].map(o=>`<option>${o}</option>`).join("")}</select></div><div class="field"><label for="kt">Tipo</label><select id="kt"><option>Rezagado</option><option>Adelantado</option></select></div></div>
      <div class="field"><label for="kn">Indicador</label><input id="kn" placeholder="Unidades vendidas por mes, recompra, reconocimiento asistido…"></div>
      <div class="field"><label for="kf">Fórmula</label><input id="kf" placeholder="Clientes que compran dos veces ÷ clientes"></div>
      <div class="grid2"><div class="field"><label for="kfu">Fuente del dato</label><input id="kfu" placeholder="Hoja de ventas, encuesta de diez, tablero"></div><div class="field"><label for="kfr">Frecuencia</label><select id="kfr">${["Semanal","Quincenal","Mensual","Trimestral"].map(o=>`<option>${o}</option>`).join("")}</select></div></div>
      <div class="grid2"><div class="field"><label for="kb">Línea base</label><input id="kb" inputmode="decimal"></div><div class="field"><label for="km">Meta</label><input id="km" inputmode="decimal"></div>
      <div class="field"><label for="kr">Umbral rojo (menor que)</label><input id="kr" inputmode="decimal"></div><div class="field"><label for="kv">Umbral verde (mayor o igual)</label><input id="kv" inputmode="decimal"></div></div>
      <div class="grid2"><div class="field"><label for="kre">Responsable</label><input id="kre" placeholder="Rol o nombre"></div><div class="field"><label for="ka">Valor actual (opcional)</label><input id="ka" inputmode="decimal"></div></div>
      <button class="btn btn-acc btn-block" id="kadd" ${d.ind.length>=8?"disabled":""}>${d.ind.length>=8?"Ya hay ocho: más es ruido":"Guardar indicador"}</button><div class="msg" id="kmsg"></div></div>
    <div class="panel"><h3>Tablero · ${d.ind.length} indicador${d.ind.length===1?"":"es"} · ${n} completo${n===1?"":"s"}</h3>
      ${d.ind.length?`<div class="tablewrap"><table class="table"><tr><th>Objetivo</th><th>Indicador</th><th>Base</th><th>Meta</th><th>Actual</th><th>Semáforo</th><th></th></tr>${d.ind.map((k,i)=>{ const s=semaforo(k); const dv=(k.actual!==""&&!isNaN(k.actual)&&parseFloat(k.meta))?Math.round((parseFloat(k.actual)-parseFloat(k.meta))/parseFloat(k.meta)*100):null;
        return `<tr><td>${esc(k.objetivo)}</td><td><b>${esc(k.nombre)}</b><br><span class="note">${esc(k.formula)} · ${esc(k.frecuencia)}</span></td><td class="num">${esc(k.base)}</td><td class="num">${esc(k.meta)}</td><td class="num"><input value="${esc(k.actual)}" data-i="${i}" class="act" inputmode="decimal" style="width:74px;padding:6px 8px"></td><td>${s?`<span class="semaforo" style="background:${col[s]}"></span>${s}${dv!=null?` <span class="note">(${dv>0?"+":""}${dv}% vs meta)</span>`:""}`:"<span class=note>sin dato</span>"}${kpiCompleto(k)?"":' <span class="pill pill-warn">incompleto</span>'}</td><td><button class="x" data-i="${i}" title="Eliminar">✕</button></td></tr>`; }).join("")}</table></div>`:`<p class="note">Sin indicadores. Empieza por el objetivo principal del plan.</p>`}</div>
    ${codigoCard("KPI", n)}
    ${resumenBloque(txt, "KPI", n)}`;
  bindTop(); document.getElementById("back").addEventListener("click",home);
  document.getElementById("kadd").addEventListener("click",()=>{ const g=id=>document.getElementById(id).value.trim();
    const k={objetivo:g("ko"),tipo:g("kt"),nombre:g("kn"),formula:g("kf"),fuente:g("kfu"),frecuencia:g("kfr"),base:g("kb"),meta:g("km"),rojo:g("kr"),verde:g("kv"),resp:g("kre"),actual:g("ka")};
    const msg=document.getElementById("kmsg");
    if(!k.nombre||!k.formula){ msg.textContent="Faltan el nombre del indicador o su fórmula."; return; }
    if([k.base,k.meta,k.rojo,k.verde].some(v=>v===""||isNaN(v))){ msg.textContent="Línea base, meta y los dos umbrales deben ser números."; return; }
    if(parseFloat(k.rojo)>parseFloat(k.verde)){ msg.textContent="El umbral rojo debe ser menor que el verde. Si en tu indicador «menos es mejor», captúralo como ahorro o inviértelo."; return; }
    d.ind.push(k); jSet("tc_kpi",d); kpi(); });
  document.querySelectorAll(".act").forEach(inp=>inp.addEventListener("change",()=>{ d.ind[+inp.dataset.i].actual=inp.value.trim(); jSet("tc_kpi",d); kpi(); }));
  document.querySelectorAll(".table .x").forEach(b=>b.addEventListener("click",()=>{ if(confirm("¿Eliminar este indicador?")){ d.ind.splice(+b.dataset.i,1); jSet("tc_kpi",d); kpi(); } }));
  bindResumen(txt,"tc_kpi",kpi,"KPI",n);
  window.scrollTo(0,0);
}

/* ================= 6. ESCUCHA SOCIAL ================= */
const PLATS = ["Google Maps (reseñas)","Mercado Libre (reseñas)","Amazon (reseñas)","YouTube (comentarios)","TikTok (comentarios)","Facebook (grupos y comentarios)","Instagram (comentarios)","Reddit (hilos)","X","Otra"];
function escucha(){
  const m=modOf("ESCUCHA"); const d=jGet("tc_escucha",{cfg:{cat:"",c1:"",c2:"",terminos:"",plats:""},men:[]}); d.men=d.men||[]; d.cfg=d.cfg||{};
  const n=d.men.length;
  const temas={};
  d.men.forEach(x=>{ const k=normTxt(x.tema)||"(sin tema)"; const t=temas[k]=temas[k]||{nombre:x.tema||"(sin tema)",n:0,pos:0,neu:0,neg:0,cita:x.texto,plat:x.plat,fecha:x.fecha}; t.n++; if(x.sent==="+")t.pos++; else if(x.sent==="−")t.neg++; else t.neu++; });
  const lista=Object.values(temas).sort((a,b)=>b.n-a.n);
  const dom=t=>t.pos>t.neg&&t.pos>=t.neu?"positivo":t.neg>t.pos&&t.neg>=t.neu?"negativo":"neutro";
  const quejas=lista.filter(t=>t.neg>0).sort((a,b)=>b.neg-a.neg).slice(0,3), elogios=lista.filter(t=>t.pos>0).sort((a,b)=>b.pos-a.pos).slice(0,3);
  const necesidades=d.men.filter(x=>x.tipo==="Necesidad no atendida");
  const sobre=["La categoría",d.cfg.c1||"Competidor 1",d.cfg.c2||"Competidor 2","Otra marca"];
  const voz=sobre.map((s,i)=>{ const xs=d.men.filter(x=>x.sobre===String(i)); return {s,n:xs.length,pct:n?Math.round(xs.length/n*100):0,pos:xs.length?Math.round(xs.filter(x=>x.sent==="+").length/xs.length*100):0,neg:xs.length?Math.round(xs.filter(x=>x.sent==="−").length/xs.length*100):0}; });
  const txt=[`ESCUCHA SOCIAL · Práctica 5 · ${perfil()?perfil().nombre:""}`, `Categoría: ${d.cfg.cat||"—"} · Competidores: ${d.cfg.c1||"—"}, ${d.cfg.c2||"—"}`, `Términos: ${d.cfg.terminos||"—"} · Plataformas: ${d.cfg.plats||"—"}`, `Menciones: ${n}`, "", "Temas (menciones · % · sentimiento dominante · cita):"]
    .concat(lista.map(t=>`  ${t.nombre}: ${t.n} · ${Math.round(t.n/n*100)}% · ${dom(t)} · «${t.cita}» (${t.plat}, ${t.fecha})`))
    .concat(["", "Tres quejas más frecuentes: "+(quejas.map(t=>t.nombre+" ("+t.neg+")").join("; ")||"—"), "Tres elogios más frecuentes: "+(elogios.map(t=>t.nombre+" ("+t.pos+")").join("; ")||"—"), "Necesidades que nadie atiende: "+(necesidades.map(x=>"«"+x.texto+"»").join("; ")||"—"), "", "Participación de voz:"])
    .concat(voz.map(v=>`  ${v.s}: ${v.n} menciones (${v.pct}%) · ${v.pos}% positivas · ${v.neg}% negativas`))
    .concat(["", "Muestra de menciones:"]).concat(d.men.slice(0,80).map((x,i)=>`${i+1}. [${x.plat} · ${x.fecha} · ${x.sent} · ${x.tema||"sin tema"} · ${sobre[+x.sobre]||""}] ${x.texto}`)).join("\n");
  $app.innerHTML=cabecera(m)+`
    <div class="panel"><div class="paso">Paso 1 · Diseño de la escucha</div><h3>Qué escuchamos y dónde</h3>
      <div class="field"><label for="ecat">La categoría</label><input id="ecat" value="${esc(d.cfg.cat)}" placeholder="Café de especialidad en Hermosillo"></div>
      <div class="grid2"><div class="field"><label for="ec1">Competidor 1</label><input id="ec1" value="${esc(d.cfg.c1)}"></div><div class="field"><label for="ec2">Competidor 2</label><input id="ec2" value="${esc(d.cfg.c2)}"></div></div>
      <div class="field"><label for="eter">Términos de búsqueda (5 a 8, como lo dice la gente)</label><input id="eter" value="${esc(d.cfg.terminos)}" placeholder="café rico, cafetería cerca, latte helado…"></div>
      <div class="field"><label for="epl">Plataformas (mínimo 3, del Anexo 1)</label><input id="epl" value="${esc(d.cfg.plats)}" placeholder="Google Maps, TikTok, Reddit"></div>
      <button class="btn btn-ghost btn-block" id="esave">Guardar diseño</button></div>
    <div class="panel"><div class="paso">Paso 2 · Recolección</div><h3>Mención ${n+1}</h3>
      <p class="note">Menciones reales, con sus palabras, sin corregir la ortografía. Nada de nombres de personas. El tema se escribe corto («tiempo de espera», «precio», «sabor») y se reutiliza: un tema con dos menciones no es un tema.</p>
      <div class="grid2"><div class="field"><label for="mpl">Plataforma</label><select id="mpl">${PLATS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label for="mfe">Fecha de la mención</label><input id="mfe" type="date" value="${hoyISO()}"></div></div>
      <div class="field"><label for="mtx">Mención (resumida o textual)</label><textarea id="mtx" rows="2" placeholder="«Todas cierran a las ocho; después de esa hora no hay dónde»"></textarea></div>

/* ================= 7. RECUERDO DE MARCA ================= */
function marcaMatch(txt, marcas){ const t=normTxt(txt); if(!t) return null; for(const b of marcas){ const nb=normTxt(b); if(nb && (t===nb || t.includes(nb) || nb.includes(t))) return b; } return null; }
function recuerdo(){
  const m=modOf("RECUERDO"); const d=jGet("tc_recuerdo",{cfg:{cat:"",marcas:""},part:[]}); d.part=d.part||[]; d.cfg=d.cfg||{};
  const marcas=(d.cfg.marcas||"").split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).slice(0,8);
  const n=d.part.length; const cfgOk=d.cfg.cat&&marcas.length>=4;
  const res=marcas.map(b=>({b, esp:d.part.filter(p=>p.esp.some(x=>marcaMatch(x,[b])===b)).length, top:d.part.filter(p=>marcaMatch(p.esp[0],[b])===b).length, rec:d.part.filter(p=>(p.rec||[]).includes(b)).length}));
  const otras={}; d.part.forEach(p=>p.esp.forEach(x=>{ if(x && !marcaMatch(x,marcas)){ const k=normTxt(x); otras[k]=otras[k]||{nombre:x,n:0}; otras[k].n++; } }));
  const otrasL=Object.values(otras).sort((a,b)=>b.n-a.n);
  const topEsp=res.slice().sort((a,b)=>b.top-a.top)[0], topRec=res.slice().sort((a,b)=>b.rec-a.rec)[0];
  const txt=[`RECUERDO DE MARCA · Práctica 6 · ${perfil()?perfil().nombre:""}`, `Categoría: ${d.cfg.cat||"—"} · Lista con ayuda: ${marcas.join(", ")||"—"}`, `Personas: ${n}`, "", "Marca · sin ayuda (de N) · con ayuda (de N) · primera mención:"]
    .concat(res.map(r=>`  ${r.b}: ${r.esp} · ${r.rec} · ${r.top}`))
    .concat(otrasL.length?["Marcas mencionadas fuera de la lista: "+otrasL.map(o=>o.nombre+" ("+o.n+")").join(", ")]:[])
    .concat(n?["", `Domina la memoria de corto plazo (top of mind): ${topEsp.b} (${topEsp.top} de ${n}). Domina el reconocimiento (largo plazo): ${topRec.b} (${topRec.rec} de ${n}).`]:[])
    .concat(["", "Registro por persona:"]).concat(d.part.map((p,i)=>`${i+1}. sin ayuda: ${p.esp.filter(Boolean).join(", ")||"ninguna"} · con ayuda: ${(p.rec||[]).join(", ")||"ninguna"}`)).join("\n");
  $app.innerHTML=cabecera(m)+`
    <div class="panel"><div class="paso">Antes de empezar</div><h3>La categoría y la lista de ocho marcas</h3>
      <div class="field"><label for="rcat">Categoría (como la diría la gente)</label><input id="rcat" value="${esc(d.cfg.cat)}" placeholder="café de olla en frasco, cerveza artesanal, crema para el sol…"></div>
      <div class="field"><label for="rmar">Ocho marcas para la pregunta con ayuda (una por línea o separadas por coma)</label><textarea id="rmar" rows="4">${esc(d.cfg.marcas)}</textarea></div>
      <button class="btn btn-ghost btn-block" id="rsave">Guardar lista</button>${marcas.length&&marcas.length<4?`<p class="msg">Escribe al menos cuatro marcas; la práctica pide ocho.</p>`:""}</div>
    <div class="panel"><div class="paso">Paso 1 · Recuerdo de marca</div><h3>Persona ${n+1}</h3>
      <p class="note">Del segmento del cliente de tu equipo. Primero, sin ayuda: «dime tres marcas de ${esc(d.cfg.cat||"[categoría]")}». Escribe lo que diga en el orden en que lo diga: la primera es top of mind. Después muestra la lista y marca cuáles conoce.</p>
      <div class="grid3"><div class="field"><label for="e1">1.ª que dijo</label><input id="e1" autocomplete="off"></div><div class="field"><label for="e2">2.ª</label><input id="e2" autocomplete="off"></div><div class="field"><label for="e3">3.ª</label><input id="e3" autocomplete="off"></div></div>
      <div class="field"><label>Con ayuda: ¿cuáles conoce?</label><div class="toggles" id="recs">${marcas.map((b,i)=>`<label><input type="checkbox" data-b="${esc(b)}"> <span>${esc(b)}</span></label>`).join("")||"<p class=note>Guarda primero la lista de marcas.</p>"}</div></div>
      <button class="btn btn-acc btn-block" id="radd" ${cfgOk?"":"disabled"}>${cfgOk?"Guardar persona":"Primero guarda la categoría y al menos cuatro marcas"}</button><div class="msg" id="rmsg"></div></div>
    <div class="panel"><h3>Resultados · ${n} persona${n===1?"":"s"}</h3>
      ${n?`<div class="tablewrap"><table class="table"><tr><th>Marca</th><th>Sin ayuda (de ${n})</th><th>Con ayuda (de ${n})</th><th>Primera mención</th></tr>${res.map(r=>`<tr><td><b>${esc(r.b)}</b></td><td class="num">${r.esp}</td><td class="num">${r.rec}</td><td class="num">${r.top}</td></tr>`).join("")}</table></div>
      ${otrasL.length?`<p class="note" style="margin-top:8px"><b>Fuera de la lista:</b> ${esc(otrasL.map(o=>o.nombre+" ("+o.n+")").join(", "))}</p>`:""}
      <div class="fb fb-acc" style="margin-top:12px"><b>Corto plazo (top of mind):</b> ${esc(topEsp.b)} (${topEsp.top} de ${n}). <b>Largo plazo (reconocimiento):</b> ${esc(topRec.b)} (${topRec.rec} de ${n}). La diferencia entre lo espontáneo y lo reconocido es el posicionamiento real de cada marca.</div>
      <div class="list" style="margin-top:12px">${d.part.map((p,i)=>`<div class="item"><div><div class="t">${i+1}. ${esc(p.esp.filter(Boolean).join(", ")||"ninguna")}</div><div class="m">reconoce: ${esc((p.rec||[]).join(", ")||"ninguna")}</div></div><button class="x" data-i="${i}" title="Eliminar">✕</button></div>`).join("")}</div>`
      : `<p class="note">Sin personas todavía. Diez personas del segmento del cliente de tu equipo.</p>`}</div>
    ${codigoCard("RECUERDO", n)}
    ${resumenBloque(txt, "RECUERDO", n)}`;
  bindTop(); document.getElementById("back").addEventListener("click",home);
  document.getElementById("rsave").addEventListener("click",()=>{ d.cfg={cat:document.getElementById("rcat").value.trim(),marcas:document.getElementById("rmar").value.trim()}; jSet("tc_recuerdo",d); recuerdo(); });
  document.getElementById("radd").addEventListener("click",()=>{ const g=id=>document.getElementById(id).value.trim(); const esp=[g("e1"),g("e2"),g("e3")]; const rec=Array.from(document.querySelectorAll("#recs input:checked")).map(c=>c.dataset.b);
    if(!esp[0] && !rec.length){ document.getElementById("rmsg").textContent="Registra al menos una marca sin ayuda o una reconocida (o escribe «ninguna»)."; return; }
    d.part.push({esp,rec}); jSet("tc_recuerdo",d); recuerdo(); });
  document.querySelectorAll(".item .x").forEach(b=>b.addEventListener("click",()=>{ if(confirm("¿Eliminar esta persona?")){ d.part.splice(+b.dataset.i,1); jSet("tc_recuerdo",d); recuerdo(); } }));
  bindResumen(txt,"tc_recuerdo",recuerdo,"RECUERDO",n);
  window.scrollTo(0,0);
}

/* ================= ZONA DOCENTE ================= */
/* La fuente canónica de la página viaja dentro de ella (bloque tc-src, base64 UTF-8) para poder
   republicarse sin serializar el DOM vivo. SKELETON reproduce el envoltorio con que se sirve la app. */
const SKELETON_HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
const SKELETON_TAIL = '\n</body></html>';
function b64enc(t){ return btoa(unescape(encodeURIComponent(t))); }
function b64dec(b){ return decodeURIComponent(escape(atob(b))); }
function fuenteCanonica(){
  const el=document.getElementById("tc-src"); if(!el) return null;
  try{ return b64dec(el.textContent.trim()); }catch(e){ return null; }
}
function documentoPublicable(T){
  const cuerpo = T.replace("<!--SRC-->", '<script type="text/plain" id="tc-src">'+b64enc(T)+'</'+'script>');
  return SKELETON_HEAD + cuerpo + SKELETON_TAIL;
}
/* Publicación directa en GitHub Pages desde la zona docente: la app reescribe la línea de configuración
   de index.html en el repositorio con un token personal del profesor (permiso de contenido solo sobre
   este repositorio). El token vive en el navegador del profesor, nunca en el archivo publicado. */
function ghToken(){ try{ return sessionStorage.getItem("tc_ghtoken") || lsGet("tc_ghtoken") || ""; }catch(e){ return lsGet("tc_ghtoken") || ""; } }
function ghGuardarToken(tok, recordar){ try{ sessionStorage.setItem("tc_ghtoken", tok); }catch(e){} if(recordar) lsSet("tc_ghtoken", tok); else lsDel("tc_ghtoken"); }
function ghOlvidarToken(){ try{ sessionStorage.removeItem("tc_ghtoken"); }catch(e){} lsDel("tc_ghtoken"); }
const RE_CFG = /window\.TC_CONFIG=\{[\s\S]*?\};/;
function conConfig(texto, linea){
  if(!RE_CFG.test(texto)) return null;
  let nuevo = texto.replace(RE_CFG, ()=>linea);
  nuevo = nuevo.replace(/(<script type="text\/plain" id="tc-src">)([^<]*)(<\/script>)/, (m,a,b,c)=>{ try{ return a + b64enc(b64dec(b.trim()).replace(RE_CFG, ()=>linea)) + c; }catch(e){ return m; } });
  return nuevo;
}
async function ghPublicar(linea){
  const tok = ghToken(); if(!tok) throw {code:"no_token"};
  const h = {"Authorization":"Bearer "+tok, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
  let r = await fetch(GH_API_FILE+"?ref=main&t="+Date.now(), {headers:h, cache:"no-store"});
  if(r.status===401||r.status===403) throw {code:"auth", status:r.status};
  if(r.status===404) throw {code:"repo"};
  if(!r.ok) throw {code:"get", status:r.status};
  const j = await r.json();
  const actual = b64dec(String(j.content||"").replace(/\n/g,""));
  const nuevo = conConfig(actual, linea); if(nuevo===null) throw {code:"no_cfg"};
  if(nuevo===actual) return {sin_cambios:true};
  r = await fetch(GH_API_FILE, {method:"PUT", headers:Object.assign({"Content-Type":"application/json"},h),
        body:JSON.stringify({message:"Configuración actualizada desde la zona docente", content:b64enc(nuevo), sha:j.sha, branch:"main"})});
  if(r.status===401||r.status===403) throw {code:"auth", status:r.status};
  if(r.status===409||r.status===422) throw {code:"conflict"};
  if(!r.ok) throw {code:"put", status:r.status};
  return {sin_cambios:false};
}
async function ghEnLinea(linea){
  const r = await fetch(SHARE_URL+"index.html?v="+Date.now(), {cache:"no-store"});
  const t = await r.text(); const m = t.match(RE_CFG);
  return !!(m && m[0]===linea);
}

      <p class="note" style="margin-top:10px">${esc(SHARE_URL)}</p></div>
    <div class="docente"><h3>Sugerencia de uso</h3>
      <p>Cada herramienta es la hoja de campo del componente individual de su práctica: el código encierra cuántos registros hizo cada alumno y de qué fecha. Los datos viven en el teléfono de cada quien; pide que copien el resumen a la práctica el mismo día. Las prácticas en equipo se validan alumno por alumno: cada integrante entrega su propio código.</p>
      <button class="btn btn-ghost" id="salir">Cerrar acceso docente</button></div>`;
  bindTop(); document.getElementById("back").addEventListener("click",home);

  const bindForget=()=>{ const f=document.getElementById("ghforget"); if(f) f.addEventListener("click",()=>{ ghOlvidarToken(); const st=document.getElementById("ghstat"); if(st) st.textContent="GitHub: sin conectar todavía (se pide al publicar por primera vez)."; }); };
  bindForget();
  document.getElementById("pub").addEventListener("click",async ()=>{
    const btn=document.getElementById("pub"), msg=document.getElementById("pubmsg");
    const nuevos=Array.from(document.querySelectorAll("#tgl input")).filter(c=>c.checked).map(c=>c.dataset.id);
    const claveN=document.getElementById("ncl").value.trim(), pinN=document.getElementById("npin").value.trim();

    const cfgNueva={pin:pinN, clave:claveN, activos:nuevos};

    if(IS_GH){
      const manual = `<details style="margin-top:12px"><summary class="note" style="cursor:pointer">Si prefieres hacerlo a mano, sin conectar GitHub</summary>

        <textarea readonly rows="3" style="font-family:'JetBrains Mono',monospace;font-size:.78rem;margin:6px 0" onclick="this.select()">${esc(linea)}</textarea></details>`;
      const publicar = async ()=>{
        btn.disabled=true; msg.innerHTML="Publicando en GitHub…";
        try{
          const r = await ghPublicar(linea);
          Object.assign(CONFIG, cfgNueva);
          msg.innerHTML = r.sin_cambios ? `<div class="val-out fb-acc">No había nada que cambiar: la configuración en línea ya es esta.</div>`
            : `<div class="val-out fb-ok"><b>Publicado ✔</b> GitHub tarda uno o dos minutos en actualizar la página; los alumnos deben recargarla.</div><button class="btn btn-ghost btn-sm" id="ghcheck" style="margin-top:8px">Comprobar si ya está en línea</button><span class="note" id="ghcheckmsg" style="margin-left:8px"></span>`;
          const ck=document.getElementById("ghcheck"); if(ck) ck.addEventListener("click", async ()=>{ const o=document.getElementById("ghcheckmsg"); o.textContent="Comprobando…"; try{ o.textContent = (await ghEnLinea(linea)) ? "Ya está en línea ✔" : "Todavía no; vuelve a comprobar en un minuto."; }catch(e){ o.textContent="No se pudo comprobar; inténtalo de nuevo."; } });
          const st=document.getElementById("ghstat"); if(st) st.innerHTML='GitHub: conectado en este dispositivo. <button class="btn btn-ghost btn-sm" id="ghforget" style="margin-left:6px">Desconectar</button>';
          bindForget();
        }catch(e){
          const c=e&&e.code;
          if(c==="no_token"){ pedirToken(); return; }
          if(c==="auth"){ ghOlvidarToken(); msg.innerHTML=`<div class="val-out fb-bad"><b>GitHub no aceptó el token</b> (caducó, se revocó o no tiene permiso de contenido sobre ${esc(GH_REPO)}). Vuelve a conectar con un token nuevo.</div>`; pedirToken(); return; }
          if(c==="conflict") msg.innerHTML=`<div class="val-out fb-warn">Alguien cambió el archivo hace un momento. Espera unos segundos y vuelve a tocar “Guardar y publicar cambios”.</div>`;
          else if(c==="repo") msg.innerHTML=`<div class="val-out fb-bad">No se encontró el archivo index.html en ${esc(GH_REPO)}.</div>`;
          else if(c==="no_cfg") msg.innerHTML=`<div class="val-out fb-bad">El archivo en línea no tiene la línea de configuración; hay que reconstruir la app.</div>`;
          else msg.innerHTML=`<div class="val-out fb-bad">No se pudo publicar${e&&e.status?" (GitHub respondió "+e.status+")":""}. Revisa la conexión a internet e inténtalo de nuevo.</div>`+manual;
        }finally{ btn.disabled=false; }
      };
      const pedirToken = ()=>{
        btn.disabled=false;
        msg.innerHTML = `<div class="val-out fb-acc"><b>Conectar la app con tu cuenta de GitHub</b> (una sola vez por dispositivo). Necesitas un token que solo pueda escribir en el repositorio de la app:
          <ol style="margin:8px 0 0 18px;padding:0;line-height:1.5">
            <li>Abre <a href="${GH_TOKEN_URL}" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> con tu cuenta.</li>
            <li>Token name: <b>Campo TMyCG</b>. Expiration: la fecha más lejana que permita.</li>
            <li>Repository access: <b>Only select repositories</b> → <b>campo-tmycg</b>.</li>
            <li>Permissions → Repository permissions → <b>Contents</b> → <b>Read and write</b>.</li>
            <li>Generate token. Copia el texto que empieza con <b>github_pat_</b> y pégalo aquí.</li></ol></div>
          <div class="field" style="margin-top:12px"><label for="ghtok">Token de GitHub</label><input id="ghtok" type="password" autocomplete="off" placeholder="github_pat_…"></div>
          <label class="chk" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)"><input type="checkbox" id="ghrec" checked> Recordar en este dispositivo (desmárcalo en una computadora compartida)</label>
          <button class="btn btn-acc" id="ghconn">Conectar y publicar</button>${manual}`;
        document.getElementById("ghconn").addEventListener("click",()=>{
          const tok=document.getElementById("ghtok").value.trim();
          if(!tok){ document.getElementById("ghtok").focus(); return; }
          ghGuardarToken(tok, document.getElementById("ghrec").checked); publicar();
        });
      };
      if(!ghToken()) pedirToken(); else publicar();
      return;
    }
    btn.disabled=true; msg.textContent="Publicando cambios…";
    try{
      const ns=(window.claude&&window.claude.use)?await window.claude.use("artifact"):null;
      if(!ns) throw {code:"no_ns"};
      const T=fuenteCanonica(); if(!T) throw {code:"no_src"};
      const T2=T.replace(/window\.TC_CONFIG=\{[\s\S]*?\};/, linea);
      if(T2===T) throw {code:"no_cfg"};
      await ns.publish(documentoPublicable(T2));
      msg.textContent="Cambios publicados ✔ La app se actualizará sola en unos segundos.";
    }catch(e){
      btn.disabled=false;
      if(e&&e.code==="conflict") msg.textContent="Hubo otro cambio más reciente; la app se recargará con la última versión. Vuelve a intentarlo después.";
      else if(e&&(e.code==="not_writer"||e.code==="not_granted")) msg.textContent="Este navegador no tiene permiso de escritura sobre la app. Ábrela con la sesión de Claude del dueño e inténtalo de nuevo.";
      else msg.textContent="No se pudo publicar. Abre la app en un navegador donde tengas tu sesión de Claude iniciada (solo el dueño puede publicar) e inténtalo de nuevo.";
    }
  });
  const valida=(code,nm)=>{ const r=readShortCode(code,nm); if(!r) return null; const m=modOf(r.mod); return Object.assign(r,{titulo:m?m.titulo:r.mod, practica:m?m.practica:"", umbral:m?m.umbral:0, cuenta:m?m.cuenta:"", cumple:m?r.n>=m.umbral:false}); };
  document.getElementById("valbtn").addEventListener("click",()=>{
    const out=document.getElementById("valout"); const nm=document.getElementById("valnm").value.trim();

  });
  document.getElementById("masbtn").addEventListener("click",()=>{
    const out=document.getElementById("masout"); const lines=document.getElementById("masin").value.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length){ out.innerHTML=`<div class="val-out fb-bad">No hay filas que revisar.</div>`; return; }
    const rows=lines.map(l=>{ const cells=l.split(/\t|;|,(?=\s)/).map(c=>c.trim()).filter(Boolean);
      const cands=cells.filter(c=>/^[A-Za-z0-9]{5}-?[A-Za-z0-9]{5}$/.test(c.replace(/\s/g,"")));
      let best=null;
      for(const cd of cands){ for(const nm of cells){ if(nm===cd) continue; const r=valida(cd,nm); if(r){ best={nm,r}; break; } } if(best) break; }
      return best ? `${esc(best.nm)}\t${esc(best.r.titulo)}\t${best.r.n}\t${best.r.cumple?"Cumple":"No alcanza"}\t${best.r.fecha}` : `${esc(cells[0]||"?")}\tINVÁLIDO\t\t\t`; });
    out.innerHTML=`<div class="val-out fb-acc"><b>${rows.length} fila${rows.length===1?"":"s"}.</b> Copia el resultado de regreso a tu hoja (nombre · herramienta · registros · mínimo · fecha):</div><textarea readonly rows="8" style="font-family:'JetBrains Mono',monospace;font-size:.78rem;margin-top:8px" onclick="this.select()">${rows.join("\n")}</textarea>`;
  });
  document.getElementById("qrbtn").addEventListener("click",()=>{ const w=document.getElementById("qrwrap"); w.innerHTML = QR_SVG && !QR_SVG.startsWith("__") ? `<div class="qrwrap">${QR_SVG}</div>` : `<div class="val-out fb-warn">El QR se genera al publicar la app; mientras tanto comparte el enlace de abajo.</div>`; });
  window.scrollTo(0,0);
}
